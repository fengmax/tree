<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>愈合之树</title>
<meta name="description" content="一棵只陪你不催促的树。它按真实时间慢慢生长，陪你把身体与自己慢慢修复。" />
<meta name="theme-color" content="#eaf3ec" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ============================================================
 愈合之树 (Healing Tree)
 设计原则 —— 写在最前，任何改动都必须遵守：
   ❌ 无倒计时、无能量条、无枯萎/死亡/惩罚
   ❌ 无“连续签到断签重置进度”
   ❌ 无排行榜/分数/竞争
   ❌ 无“你 N 天没来了”式催促弹窗
   ❌ 无复杂任务系统
   树只会慢慢长，永不倒退。哪怕只是打开看一眼，也是一种照顾。
 ============================================================ -->

<!-- 昼夜背景层 -->
<div class="sky" id="sky" aria-hidden="true"></div>
<canvas class="particles" id="particles" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <!-- 顶部：问候 + 结疤旁的花 -->
  <header class="top">
    <div class="greeting" id="greeting">你来了。</div>
    <div class="subline" id="timeOfDay"></div>
  </header>

  <!-- 画面主体：树生长区 -->
  <section class="scene">
    <!-- 用内联 SVG 承载参数化生长的树 -->
    <svg id="treeSvg" class="tree-svg" viewBox="0 0 320 440" preserveAspectRatio="xMidYMax meet">
      <defs>
        <radialGradient id="trunkGrad" cx="50%" cy="50%" r="65%">
          <stop offset="0%" stop-color="#a97c50"/>
          <stop offset="100%" stop-color="#8a5f3b"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.1"/>
        </filter>
      </defs>
      <!-- soil 由 JS 注入；树各组由 JS 参数化生成 -->
      <g id="treeRoot"></g>
    </svg>
  </section>

  <!-- 地下水壶按钮 -->
  <button class="water-btn" id="waterBtn" aria-label="给树浇水">
    <span class="btn-inner">
      <span class="pour" id="pour"></span>
      浇水
    </span>
    <small class="water-state" id="waterState"></small>
  </button>

  <!-- 底部控制排 -->
  <footer class="dock">
    <button class="dock-btn" id="breathBtn" aria-label="呼吸引导">🌬️ 呼吸</button>
    <button class="dock-btn" id="feelBtn" aria-label="记录今天感受">🍃 感受</button>
    <button class="dock-btn" id="muteBtn" aria-label="声音开关">🔊</button>
  </footer>

  <!-- 静音常驻角标 -->
  <div class="quiet-note" id="quietNote" hidden></div>
</main>

<!-- ===== 呼吸引导浮层 ===== -->
<div class="overlay" id="breathOverlay" hidden>
  <div class="breath-card">
    <div class="breath-ring" id="breathRing"><span id="breathWord">吸气</span></div>
    <p class="breath-tip" id="breathTip"></p>
    <button class="ghost-btn" id="breathClose">收好</button>
  </div>
</div>

<!-- ===== 感受记录浮层 ===== -->
<div class="overlay" id="feelOverlay" hidden>
  <div class="feel-card">
    <h3>今天的感觉</h3>
    <p class="feel-sub">选一个，或都不选。只是看看也够好。</p>
    <div class="moods" id="moodRow">
      <button class="mood" data-f="0" data-color="#c7dfc9" style="--c:#c7dfc9">平静</button>
      <button class="mood" data-f="1" data-color="#d9e5f2" style="--c:#d9e5f2">还好</button>
      <button class="mood" data-f="2" data-color="#ead4a0" style="--c:#ead4a0">有点累</button>
      <button class="mood" data-f="3" data-color="#e7cccc" style="--c:#e7cccc">难受</button>
    </div>
    <div class="feel-better" id="betterWrap" hidden>
      <button class="ghost-btn gold" id="betterBtn">比昨天好一点 ✦</button>
    </div>
    <div class="gold-note" id="goldNote"></div>
    <button class="ghost-btn" id="feelClose">记好了</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
