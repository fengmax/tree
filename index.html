<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>愈合之树</title>
<meta name="description" content="一棵只陪你不催促的树。它按真实时间慢慢生长，陪你把身体与自己慢慢修复。" />
<meta name="theme-color" content="#eaf3ec" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- ============================================================
 愈合之树 (Healing Tree)
 设计原则 —— 写在最前，任何改动都必须遵守：
   ❌ 无倒计时、无能量条、无枯萎/死亡/惩罚
   ❌ 无“连续签到断签重置进度”
   ❌ 无排行榜/分数/竞争
   ❌ 无“你 N 天没来了”式催促弹窗
   ❌ 无复杂任务系统
   树只会慢慢长，永不倒退。哪怕只是打开看一眼，也是一种照顾。
 ============================================================ -->

<!-- 昼夜背景层 -->
<div class="sky" id="sky" aria-hidden="true"></div>
<canvas class="particles" id="particles" aria-hidden="true"></canvas>

<main class="stage" id="stage">
  <!-- 顶部：问候 + 结疤旁的花 -->
  <header class="top">
    <div class="greeting" id="greeting">你来了。</div>
    <div class="subline" id="timeOfDay" aria-live="polite"></div>
    <div class="stage-info" id="stageInfo" aria-live="polite"></div>
  </header>

  <aside class="daily-prompt" id="dailyPrompt" aria-live="polite" hidden>
    <span class="daily-prompt-text"></span>
    <button class="prompt-dismiss" id="promptDismiss" type="button" aria-label="收起今日提示">收起</button>
  </aside>

  <!-- 画面主体：树生长区 -->
  <section class="scene" aria-label="树的生长场景">
    <!-- 用内联 SVG 承载参数化生长的树 -->
    <svg id="treeSvg" class="tree-svg" viewBox="0 0 320 440" preserveAspectRatio="xMidYMax meet"
         role="img" aria-label="一棵正在土里歇着的种子">
      <defs>
        <!-- 土壤：顶部受光、边缘更深的柔和渐变 -->
        <radialGradient id="soilgrad" cx="50%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#9c7a55"/>
          <stop offset="72%" stop-color="#7c5b38"/>
          <stop offset="100%" stop-color="#6a4a2c"/>
        </radialGradient>
        <radialGradient id="soilTop" cx="50%" cy="42%" r="55%">
          <stop offset="0%" stop-color="#b08a5e" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#b08a5e" stop-opacity="0"/>
        </radialGradient>
        <!-- 叶团：中心浓郁、边缘渐隐的水彩“羽化”渐变 -->
        <radialGradient id="leafG0" cx="42%" cy="38%" r="75%">
          <stop offset="0%" stop-color="#cfe5c4" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#a6c9a0" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#8ab08c" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="leafG1" cx="42%" cy="38%" r="75%">
          <stop offset="0%" stop-color="#e0eed8" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#bcd8ae" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#9fbd96" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="leafG2" cx="42%" cy="38%" r="75%">
          <stop offset="0%" stop-color="#b6d3ab" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#8fb092" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#76977e" stop-opacity="0"/>
        </radialGradient>
        <!-- 小花：五片花瓣与水彩花心 -->
        <radialGradient id="petalA" cx="42%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#fae6de" stop-opacity=".95"/>
          <stop offset="60%" stop-color="#f3d3c6" stop-opacity=".6"/>
          <stop offset="100%" stop-color="#ecc0b3" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="petalB" cx="42%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#f8e0d8" stop-opacity=".9"/>
          <stop offset="60%" stop-color="#efc6bb" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#e8b7aa" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="heartG" cx="45%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#f9d9a8"/>
          <stop offset="55%" stop-color="#f3b987"/>
          <stop offset="100%" stop-color="#eba06f"/>
        </radialGradient>
        <!-- 金果：柔柔的光晕 -->
        <radialGradient id="goldHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f9eec6" stop-opacity=".8"/>
          <stop offset="55%" stop-color="#eedc9f" stop-opacity=".28"/>
          <stop offset="100%" stop-color="#eedc9f" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="goldFruit" cx="40%" cy="32%" r="70%">
          <stop offset="0%" stop-color="#f4dd90"/>
          <stop offset="55%" stop-color="#e0bd56"/>
          <stop offset="100%" stop-color="#cfaa48"/>
        </radialGradient>
        <!-- 疤：被新皮温柔包裹的柔边 -->
        <radialGradient id="scarRing" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#9a6b45" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#9a6b45" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.1"/>
        </filter>
      </defs>
      <!-- soil 与树各组由 JS 参数化生成 -->
      <g id="treeRoot"></g>
    </svg>
  </section>

  <!-- 地下水壶按钮 -->
  <button class="water-btn" id="waterBtn" aria-label="给树浇水">
    <span class="btn-inner">
      <span class="pour" id="pour" aria-hidden="true"></span>
      浇水
    </span>
    <small class="water-state" id="waterState"></small>
  </button>

  <!-- 底部控制排 -->
  <footer class="dock">
    <button class="dock-btn" id="breathBtn" aria-label="呼吸引导"><span class="dock-ico" aria-hidden="true">🌬️</span>呼吸</button>
    <button class="dock-btn" id="feelBtn" aria-label="记录今天感受"><span class="dock-ico" aria-hidden="true">🍃</span>感受</button>
    <button class="dock-btn" id="noteBtn" aria-label="写给自己一句话"><span class="dock-ico" aria-hidden="true">✎</span>写话</button>
    <button class="dock-btn" id="diaryBtn" aria-label="翻开以前的日记"><span class="dock-ico" aria-hidden="true">📖</span>日记</button>
    <button class="dock-btn" id="muteBtn" aria-label="声音开关"><span class="dock-ico" aria-hidden="true">🔊</span></button>
  </footer>

  <!-- ===== 声音面板 ===== -->
  <div class="overlay" id="soundOverlay" role="dialog" aria-modal="true" aria-label="声音设置" hidden>
    <div class="sound-card">
      <h3>声音</h3>
      <p class="feel-sub">选一种陪你，或调调音量。</p>
      <div class="sound-opts" id="soundOpts">
        <button class="sound-opt" data-type="auto">🌿 自动</button>
        <button class="sound-opt" data-type="rain">🌧️ 雨天</button>
        <button class="sound-opt" data-type="forest">🌲 林间</button>
        <button class="sound-opt" data-type="stream">💧 溪边</button>
        <button class="sound-opt" data-type="night">🌙 夜晚</button>
      </div>
      <div class="vol-row">
        <span class="vol-label">音量</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.5" class="vol-slider" aria-label="音量">
      </div>
      <button class="ghost-btn sound-mute" id="soundMute">播放声音</button>
      <button class="ghost-btn" id="soundClose">好了</button>
    </div>
  </div>

    <!-- ===== 写给自己的话 ===== -->
    <div class="overlay" id="noteOverlay" role="dialog" aria-modal="true" aria-labelledby="noteTitle" hidden>
      <div class="note-card">
        <h3 id="noteTitle">写给自己的话</h3>
        <p class="feel-sub">只留在这棵树上，不需要写得很好。</p>
        <textarea id="noteInput" maxlength="500" rows="4" placeholder="今天，我想对自己说……" aria-label="写给自己的话"></textarea>
        <p class="ai-consent">点击 AI 回应后，这句话会发送给你配置的模型服务。GitHub Pages 需要接口允许浏览器跨域请求。</p>
        <div class="note-actions">
          <button class="ghost-btn gold" id="noteClose">让树回应</button>
        </div>
        <button class="ghost-btn ai-reply-btn" id="aiReply">和树聊聊</button>
        <button class="text-btn" id="noteHistory">翻开以前的日记</button>
      </div>
    </div>

  <!-- ===== 日记本 ===== -->
  <div class="overlay" id="diaryOverlay" role="dialog" aria-modal="true" aria-labelledby="diaryTitle" hidden>
    <div class="diary-card">
      <h3 id="diaryTitle">日记本</h3>
      <p class="feel-sub diary-meta" id="diaryMeta"></p>
      <div class="diary-list" id="diaryList" aria-live="polite"></div>
      <p class="diary-empty" id="diaryEmpty" hidden>还没有写过。想写的时候，树一直在。</p>
      <div class="note-actions diary-foot">
        <button class="ghost-btn" id="diaryExportMd">导出 md</button>
        <button class="ghost-btn" id="yearRingBtn">树的年轮</button>
        <button class="ghost-btn gold" id="diaryClose">收好</button>
      </div>
    </div>
  </div>

  <!-- ===== 树的年轮 ===== -->
  <div class="overlay" id="ringOverlay" role="dialog" aria-modal="true" aria-labelledby="ringTitle" hidden>
    <div class="diary-card ring-card">
      <h3 id="ringTitle">树的年轮</h3>
      <p class="feel-sub diary-meta" id="ringMeta"></p>
      <div class="ring-tabs" role="group" aria-label="时间范围">
        <button class="ring-tab" data-win="7" type="button">近 7 天</button>
        <button class="ring-tab sel" data-win="30" type="button">近 30 天</button>
        <button class="ring-tab" data-win="90" type="button">近 90 天</button>
      </div>
      <div class="ring-frame">
        <svg id="ringSvg" class="ring-svg" viewBox="0 0 360 212" role="img" aria-label="最近 30 天的成长时间带"></svg>
      </div>
      <p class="ring-summary" id="ringSummary" aria-live="polite"></p>
      <div class="ring-legend">
        <span class="lg-item"><i class="lg-dot" style="background:#bcd8c2"></i>感受</span>
        <span class="lg-item"><i class="lg-line" style="background:#7fae7e"></i>写话</span>
        <span class="lg-item"><i class="lg-dot" style="background:#9cc0de"></i>浇水</span>
        <span class="lg-item"><i class="lg-dot" style="background:#e3bd57"></i>好一点</span>
      </div>
      <div class="note-actions diary-foot">
        <button class="ghost-btn gold" id="ringClose">收好</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="aiConfigOverlay" role="dialog" aria-modal="true" aria-labelledby="aiConfigTitle" hidden>
    <div class="note-card ai-config-card">
      <h3 id="aiConfigTitle">连接陪伴模型</h3>
      <p class="feel-sub">配置只保存在这台设备的浏览器里。</p>
      <label class="config-label" for="aiBaseUrl">接口地址</label>
      <input id="aiBaseUrl" class="config-input" type="url" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1">
      <label class="config-label" for="aiModel">模型名称</label>
      <input id="aiModel" class="config-input" type="text" value="gpt-4o-mini" placeholder="gpt-4o-mini">
      <label class="config-label" for="aiApiKey">API Key</label>
      <input id="aiApiKey" class="config-input" type="password" autocomplete="off" placeholder="粘贴你的 API Key">
      <p class="config-warning">仅建议在你信任的本机环境中保存 API Key。</p>
      <div class="note-actions">
        <button class="ghost-btn" id="aiConfigClose">先不用</button>
        <button class="ghost-btn gold" id="aiConfigSave">保存并继续</button>
      </div>
    </div>
  </div>

  <!-- 常驻低语行 -->
  <p class="quiet-note" id="quietNote" aria-live="polite" hidden></p>
  <p class="tree-reply" id="treeReply" aria-live="polite" hidden></p>
</main>

<!-- ===== 呼吸引导浮层 ===== -->
<div class="overlay" id="breathOverlay" role="dialog" aria-modal="true" aria-label="呼吸引导" hidden>
  <div class="breath-card">
    <div class="breath-ring" id="breathRing"><span id="breathWord">吸气</span></div>
    <p class="breath-tip" id="breathTip"></p>
    <button class="ghost-btn" id="breathClose">收好</button>
  </div>
</div>

<!-- ===== 感受记录浮层 ===== -->
<div class="overlay" id="feelOverlay" role="dialog" aria-modal="true" aria-labelledby="feelTitle" hidden>
  <div class="feel-card">
    <h3 id="feelTitle">今天的感觉</h3>
    <p class="feel-sub">选一个，或都不选。只是看看也够好。</p>
    <div class="moods" id="moodRow">
      <button class="mood" data-f="0" data-color="#c7dfc9" style="--c:#c7dfc9">平静</button>
      <button class="mood" data-f="1" data-color="#d9e5f2" style="--c:#d9e5f2">还好</button>
      <button class="mood" data-f="2" data-color="#ead4a0" style="--c:#ead4a0">有点累</button>
      <button class="mood" data-f="3" data-color="#e7cccc" style="--c:#e7cccc">难受</button>
    </div>
    <div class="feel-better" id="betterWrap" hidden>
      <button class="ghost-btn gold" id="betterBtn"><span aria-hidden="true">✦</span> 比昨天好一点</button>
    </div>
    <div class="gold-note" id="goldNote"></div>
    <div class="feel-history" id="feelHistory" hidden>
      <p class="feel-history-title">过去的日子</p>
      <div class="feel-dots" id="feelDots"></div>
    </div>
    <button class="ghost-btn" id="feelClose">记好了</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
